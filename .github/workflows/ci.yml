name: Validate pull request before putting into queue

on:
  pull_request:

jobs:

  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Display info
      run: | 
        echo "pull request!"
        pwd
        tree -a -I '.git'
        git status
    - name: Run fast CI (emulated by a short sleep)
      run: sleep 5
